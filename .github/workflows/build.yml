name: "Build APK"

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify signing secret
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set +x
          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Add the KEYSTORE_PASSWORD repository secret"
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Prepare encrypted signing keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set +x
          if [ ! -f app/release.keystore.enc ]; then
            keytool -genkeypair \
              -keystore app/release.keystore \
              -alias notificationlog \
              -storepass:env KEYSTORE_PASSWORD \
              -keypass:env KEYSTORE_PASSWORD \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Notification Log,O=Personal,C=IN"
            openssl enc -aes-256-cbc -pbkdf2 -iter 600000 -salt \
              -pass env:KEYSTORE_PASSWORD \
              -in app/release.keystore \
              -out app/release.keystore.enc
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            if [ -f app/debug.keystore ]; then
              git rm -f --ignore-unmatch app/debug.keystore
              rm -f app/debug.keystore
            fi
            git add app/release.keystore.enc
            git commit -m "Add encrypted signing key [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          else
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 -salt \
              -pass env:KEYSTORE_PASSWORD \
              -in app/release.keystore.enc \
              -out app/release.keystore
          fi

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: notificationlog
        run: |
          set +x
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            GRADLE_CMD="./gradlew"
          else
            GRADLE_CMD="gradle"
          fi
          $GRADLE_CMD assembleRelease -x lintVitalRelease -x lintVitalAnalyzeRelease --no-daemon --stacktrace

      - name: Locate and rename release APK
        run: |
          APK_PATH=$(find app/build/outputs/apk/release -maxdepth 2 -type f -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "Error: No release APK found under app/build/outputs/apk/release/"
            exit 1
          fi
          cp "$APK_PATH" NotificationLog.apk

      - name: Upload APK workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: NotificationLog
          path: NotificationLog.apk

      - name: Publish to GitHub Release (latest)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest NotificationLog.apk \
            --prerelease \
            --title "Latest build" \
            --notes "Automated release APK build from commit ${{ github.sha }}"
